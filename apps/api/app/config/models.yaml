roles:
  fast:
    provider: ollama
    model: qwen3.5:4b
    label: Qwen3.5 4B (local)
    context_window: 8192
    local: true
  smart:
    provider: ollama
    model: qwen3.5:4b
    label: Qwen3.5 4B (local)
    context_window: 8192
    local: true
  reasoning:
    provider: ollama
    model: qwen3.5:4b
    label: Qwen3.5 4B (local)
    context_window: 8192
    local: true
  coding:
    provider: ollama
    model: qwen3.5:4b
    label: Qwen3.5 4B (local)
    context_window: 8192
    local: true
  vision:
    provider: ollama
    model: qwen3.5:4b
    label: Qwen3.5 4B (local)
    context_window: 8192
    local: true
  local:
    provider: ollama
    model: qwen3.5:4b
    label: Qwen3.5 4B (local)
    context_window: 8192
    local: true
  mock:
    provider: mock
    model: orbito-fast
    label: ORBITO Fast (offline)
    context_window: 32000

# Local-first: every role resolves to Ollama, then the deterministic mock.
# Pull another model and edit the role (or override its model name with
# ORBITO_*_MODEL) to upgrade a single capability. Add cloud roles under
# `roles:` when you have keys — the gateway skips unconfigured providers.
fallbacks:
  fast: [local, mock]
  smart: [fast, local, mock]
  reasoning: [smart, fast, mock]
  coding: [smart, fast, mock]
  vision: [fast, mock]
  local: [mock]
